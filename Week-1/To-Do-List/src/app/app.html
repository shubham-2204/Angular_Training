<div class="app-wrapper">
  <!-- Decorative background orbs -->
  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>
  <div class="bg-orb orb-3"></div>

  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="header-icon">✅</div>
      <h1 class="app-title">Todo List</h1>
      <p class="app-subtitle">Stay organized, stay productive</p>
    </header>

    <!-- Card container -->
    <main class="card">
      <!-- Input Component: passes new todo data UP via (todoAdded) -->
      <app-todo-input (todoAdded)="onTodoAdded($event)"></app-todo-input>

      <!-- Filter Component: receives currentFilter & stats via [Input], emits filter changes UP -->
      <app-todo-filter
        [currentFilter]="currentFilter"
        [stats]="stats"
        (filterChanged)="onFilterChanged($event)"
      ></app-todo-filter>

      <!-- List Component: receives filtered todos DOWN via [Input], emits toggle/delete UP -->
      <app-todo-list
        [todos]="filteredTodos"
        (toggleTodo)="onToggleTodo($event)"
        (deleteTodo)="onDeleteTodo($event)"
      ></app-todo-list>
    </main>

    <!-- Footer -->
    <footer class="app-footer">
      <p>Built with <span class="heart">❤️</span> using Angular</p>
    </footer>
  </div>
</div>
